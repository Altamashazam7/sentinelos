name: SentinelOS CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Tests
        run: |
          cd backend
          pytest

      - name: Ruff
        run: |
          cd backend
          ruff check .

      - name: Black
        run: |
          cd backend
          black --check .
