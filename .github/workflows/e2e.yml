name: SentinelOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint demo code
        run: python -m ruff check services/demo_service.py services/git_utils.py tests/e2e ../demo-repo/setup_demo.py
      - name: Unit tests
        run: python -m pytest -q tests --ignore=tests/e2e
      - name: Integration tests
        run: python -m pytest -q tests/test_api.py tests/test_phase3_services.py tests/test_workflow.py
      - name: End-to-end tests
        env:
          GITHUB_TOKEN: ${{ secrets.SENTINELOS_E2E_GITHUB_TOKEN }}
          SENTINELOS_E2E_REPO: ${{ vars.SENTINELOS_E2E_REPO }}
          SENTINELOS_LIVE_GITHUB: ${{ vars.SENTINELOS_LIVE_GITHUB }}
        run: python -m pytest -q tests/e2e
